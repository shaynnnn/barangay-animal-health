    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0">

        Animal Welfare Missions
    </title>

        rel="stylesheet"
        href="../style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script src="../firebase.js"></script>

</head>


<body>


<header class="site-header">


    <div class="brand">


        <svg
            class="paw-logo"
            viewBox="0 0 100 100">


            <ellipse
                cx="50"
                cy="63"
                rx="27"
                ry="24"/>


            <ellipse
                cx="25"
                cy="35"
                rx="10"
                ry="15"/>


            <ellipse
                cx="43"
                cy="22"
                rx="10"
                ry="15"/>


            <ellipse
                cx="62"
                cy="22"
                rx="10"
                ry="15"/>


            <ellipse
                cx="78"
                cy="35"
                rx="10"
                ry="15"/>


        </svg>


        <div class="brand-name">

            <div>
                Barangay Animal
            </div>

            <div>
                Healthcare System
            </div>

        </div>


    </div>



    <button
        class="menu-toggle"
        onclick="toggleMenu()">

        ☰

    </button>



    <nav id="mainNav">


        <a href="../index.html">

            Home

        </a>


        <a href="registry.html">

            Registry

        </a>


        <a href="vaccination.html">

            Vaccination

        </a>


        <a href="bitecases.html">

            Bite Cases

        </a>


        <a href="adoption.html">

            Adoption

        </a>


        <a
            href="missions.html"
            class="active">

            Missions

        </a>


    </nav>


</header>



<main class="module-page missions-page">


    <a
        href="../index.html"
        class="back-home">

        ← Back Home

    </a>



    <div class="module-heading">


        <div>


            <h1>

                Animal Welfare Missions

            </h1>


            <p>

                Community activities for animal welfare.

            </p>


        </div>



        <button
            class="primary-btn"
            onclick="toggleElement('missionForm')">

            + Add Mission

        </button>


    </div>



    <!-- =====================================================
         CREATE MISSION
    ====================================================== -->

    <section
        id="missionForm"
        class="form-panel hidden">


        <h2>

            Create Mission

        </h2>



        <form id="missionFormElement">


            <div class="form-grid">


                <!-- MISSION NAME - REQUIRED -->

                <div class="form-group">


                    <label for="eventName">

                        Mission Name

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="eventName"
                        placeholder="e.g. Libreng Bakuna"
                        required>


                </div>



                <!-- DATE - REQUIRED -->

                <div class="form-group">


                    <label for="eventDate">

                        Date

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="date"
                        id="eventDate"
                        required>


                </div>



                <!-- LOCATION - REQUIRED -->

                <div class="form-group">


                    <label for="missionLocation">

                        Location

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="missionLocation"
                        placeholder="e.g. Barangay Covered Court"
                        required>


                </div>



                <!-- CATEGORY - REQUIRED -->

                <div class="form-group">


                    <label for="missionCategory">

                        Category

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                        id="missionCategory"
                        required
                        onchange="handleMissionCategoryChange()">


                        <option
                            value="Vaccination">

                            Vaccination

                        </option>


                        <option
                            value="Pet Grooming">

                            Pet Grooming

                        </option>


                        <option
                            value="Basic Vet Check-up">

                            Basic Vet Check-up

                        </option>


                        <option
                            value="Deworming Drive">

                            Deworming Drive

                        </option>


                        <option
                            value="Free Pet Food Distribution">

                            Free Pet Food Distribution

                        </option>


                        <option
                            value="Rescue">

                            Rescue

                        </option>


                        <option
                            value="Pet Adoption Fairs">

                            Pet Adoption Fairs

                        </option>


                        <option
                            value="Other">

                            Other

                        </option>


                    </select>


                </div>


            </div>



            <!-- =================================================
                 OTHER CATEGORY
            ================================================== -->

            <div
                id="otherMissionCategoryGroup"
                class="form-group hidden">


                <label for="otherMissionCategory">

                    Specify Other Category

                    <span class="required">
                        *
                    </span>

                </label>


                <input
                    type="text"
                    id="otherMissionCategory"
                    placeholder="e.g. Free Pet Supplies"
                    >


            </div>



            <!-- =================================================
                 DESCRIPTION - REQUIRED
            ================================================== -->

            <div class="form-group">


                <label for="missionDescription">

                    Description

                    <span class="required">
                        *
                    </span>

                </label>


                <textarea
                    id="missionDescription"
                    placeholder="e.g. Free anti-rabies vaccination for dogs and cats in the barangay."
                    required></textarea>


            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="primary-btn">

                Add Mission

            </button>


        </form>


    </section>



    <!-- =====================================================
         MISSION LIST
    ====================================================== -->

    <div
        id="missionList"
        class="mission-grid">

        Loading...

    </div>


</main>



<footer class="site-footer">


    Barangay Animal Health System © 2026


    <span>

    Contact:

        brgyoffice@email.com

    </a>


</footer>



<script src="../app.js"></script>



<script>

/* =====================================================
   OTHER MISSION CATEGORY
===================================================== */

function handleMissionCategoryChange() {

    const category =
        document.getElementById(
            "missionCategory"
        );


    const otherGroup =
        document.getElementById(
            "otherMissionCategoryGroup"
        );


    const otherInput =
        document.getElementById(
            "otherMissionCategory"
        );


    if (
        !category ||
        !otherGroup
    ) {

        return;

    }


    if (
        category.value === "Other"
    ) {

        otherGroup
            .classList
            .remove("hidden");


        if (otherInput) {

            otherInput.required =
                true;

        }

    } else {

        otherGroup
            .classList
            .add("hidden");


        if (otherInput) {

            otherInput.required =
                false;

            otherInput.value =
                "";

        }

    }

}


/* =====================================================
   INITIAL CATEGORY CHECK
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        handleMissionCategoryChange();

    }
);

</script>


</body>

</html>
