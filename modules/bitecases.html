<main class="module-page bite-page">


    <a
        href="../index.html"

        ← Back Home

    </a>



    <div class="module-heading">


        <div>


            <h1>

                Animal Bite Cases

            </h1>


            <p>

                Report and monitor animal bite incidents.

            </p>


        </div>



        <button
            class="bite-report-btn"
            onclick="toggleElement('biteForm')">

            Report Bite Incident

        </button>


    </div>



    <!-- =====================================================
         BITE CASE REPORT FORM
    ====================================================== -->

    <section
        id="biteForm"
        class="form-panel hidden">


        <h2>

            Report Bite Incident

        </h2>



        <form id="biteFormElement">


            <div class="form-grid">


                <!-- VICTIM NAME -->

                <div class="form-group">


                    <label for="victimName">

                        Victim Name

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="victimName"
                        placeholder="e.g. Juan Dela Cruz"
                        required>


                </div>



                <!-- ANIMAL TYPE -->

                <div class="form-group">


                    <label for="animalType">

                        Animal Type

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                        id="animalType"
                        required>


                        <option value="">

                            Select animal type

                        </option>


                        <option value="Dog">

                            Dog

                        </option>


                        <option value="Cat">

                            Cat

                        </option>


                        <option value="Other">

                            Other

                        </option>


                    </select>


                </div>



                <!-- INCIDENT DATE -->

                <div class="form-group">


                    <label for="incidentDate">

                        Incident Date

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="date"
                        id="incidentDate"
                        required>


                </div>


            </div>



            <!-- INCIDENT DESCRIPTION -->

            <div class="form-group">


                <label for="incidentDescription">

                    Incident Description

                    <span class="required">
                        *
                    </span>

                </label>


                <textarea
                    id="incidentDescription"
                    placeholder="e.g. The victim was bitten by a dog while walking near the barangay hall."
                    required></textarea>


            </div>



            <button
                type="submit"
                class="bite-report-btn">

                Submit Report

            </button>


        </form>


    </section>



    <!-- =====================================================
         BITE CASE LIST
    ====================================================== -->

    <div class="bite-list">


        <h2>

            Reported Bite Cases

        </h2>


        <div
            id="biteCaseList">

            Loading...

        </div>


    </div>
